# /etc/rspamd/local.d/milter_headers.conf
#
# rspamd's built-in Authentication-Results generator has a fixed method list
# (spf/dkim/dmarc/arc) with no way to register another, so the sworn= result
# is emitted as a second Authentication-Results field. RFC 8601 section 4
# explicitly permits more than one such field, and consumers parse them all.
#
# Merge "sworn-ar" into whatever routines you already use.
use = ["authentication-results", "sworn-ar"];

custom {
  sworn-ar = <<EOD
return function(task, common_meta)
  local value = task:get_mempool():get_variable('sworn_ar')
  if not value then
    return nil, {}, {}, common_meta
  end
  return nil, {['Authentication-Results'] = value}, {}, common_meta
end
EOD;
}
