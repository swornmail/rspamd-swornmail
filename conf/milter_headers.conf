# /etc/rspamd/local.d/milter_headers.conf
#
# The authentication-results routine does two jobs at a border MTA. It adds
# rspamd's own field (SPF, DKIM, DMARC), and by default it first deletes every
# inbound Authentication-Results field, which is what removes forged sworn=
# results. The swornmail module adds its own field but removes nothing, so
# keep this routine on.
#
# Don't narrow that deletion with remove_ar_from at a border MTA (see the
# README), and don't add a custom routine that sets Authentication-Results:
# milter_headers lets its output replace the field this routine queued.
use = ["authentication-results"];
