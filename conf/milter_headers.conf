# /etc/rspamd/local.d/milter_headers.conf
#
# The authentication-results routine does two jobs at a border MTA. It adds
# rspamd's own field (SPF, DKIM, DMARC), and by default it first deletes every
# inbound Authentication-Results field, which is what removes forged sworn=
# results. The swornmail module adds its own field but removes nothing, so
# keep this routine on. rspamd's stock config runs no routines at all.
#
# Don't narrow that deletion with remove_ar_from at a border MTA (see the
# README), and don't add a custom routine that sets Authentication-Results:
# milter_headers lets its output replace the field this routine queued.
use = ["authentication-results"];

# milter_headers skips authenticated and local senders by default, so their
# forged results would be kept. A compromised account could then forge
# sworn=pass for local recipients, and behind a proxy or NAT every connection
# looks local. Run the routine for them too.
authenticated_headers = ["authentication-results"];
local_headers = ["authentication-results"];

routines {
  authentication-results {
    # That puts rspamd's own field on mail your users send out, and by
    # default it names their login (smtp.auth=). Leave it out.
    add_smtp_user = false;
  }
}
