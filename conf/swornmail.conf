# /etc/rspamd/local.d/swornmail.conf — SwornMail Mode-1 attestation.
# Every symbol scores 0.0: this module reports, it does not judge.

enabled = true;

# Where the sworn.* library was installed (expects <lib_path>/sworn/*.lua).
lib_path = "/etc/rspamd/lua";

# Authentication-Results authserv-id. Defaults to this host's name; set it
# when rspamd's hostname is not your ADMD's public identity.
# authserv_id = "mx.example.com";

# Under a Postfix milter the MTA's hostname is already forward-confirmed, so
# trusting it saves two DNS queries per connection. Set false to always
# confirm rDNS inside the module instead.
use_mta_hostname = true;
